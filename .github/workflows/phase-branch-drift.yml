name: Phase branch drift guard

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches:
      - main
      - phase-2

permissions:
  contents: write

jobs:
  phase-2-mirror-and-alignment:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted active-phase branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch active Phase 2 refs
        run: git fetch origin main phase-2 --no-tags

      - name: Fast-forward passive mirror from main
        if: github.event_name != 'push' || github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor origin/phase-2 origin/main; then
            echo "::error::phase-2 has divergent commits; refusing to rewrite published history."
            exit 1
          fi
          # Fetch current main, not the triggering event SHA, so overlapping runs
          # cannot roll the mirror back to an older commit.
          git push origin refs/remotes/origin/main:refs/heads/phase-2

      - name: Require identical active-phase commits and trees
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main phase-2 --no-tags
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse origin/phase-2)" ]; then
            echo "::error::main and phase-2 point to different commits while Phase 2 is active."
            git log --oneline --left-right origin/main...origin/phase-2
            exit 1
          fi
          if ! git diff --quiet origin/main origin/phase-2 --; then
            echo "::error::main and phase-2 trees differ while Phase 2 is active."
            git diff --stat origin/main origin/phase-2
            exit 1
          fi
          echo "main and phase-2 resolve to the same commit and tree."
