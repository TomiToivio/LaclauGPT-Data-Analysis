name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint new Python violations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lint tooling
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Lint new violations in changed Python files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "${BEFORE_SHA:-}" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$BEFORE_SHA"
          else
            BASE_SHA="HEAD^"
          fi

          mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.py')
          if (( ${#FILES[@]} == 0 )); then
            echo "No changed Python files to lint."
            exit 0
          fi

          echo "Checking changed Python files for newly introduced Ruff violations:"
          printf '  %s\n' "${FILES[@]}"

          # Capture Ruff diagnostics for HEAD. Ruff exits non-zero when it finds
          # violations, so do not let `set -e` abort before we can compare them.
          ruff check --output-format=json -- "${FILES[@]}" > /tmp/ruff-head.json || true
          python - <<'PY'
          import json
          with open("/tmp/ruff-head.json", encoding="utf-8") as handle:
              for item in json.load(handle):
                  if item.get("code") == "I001" and item.get("fix"):
                      print("RUFF_I001_FIX", item["filename"], item["fix"])
          PY

          # Recreate the base versions of changed files in a temporary tree and
          # lint them with the same repository configuration. Files added by the
          # current change have no baseline diagnostics.
          BASE_TREE="$(mktemp -d)"
          trap 'rm -rf "$BASE_TREE"' EXIT
          git worktree add --detach "$BASE_TREE" "$BASE_SHA" >/dev/null
          (
            cd "$BASE_TREE"
            BASE_FILES=()
            for file in "${FILES[@]}"; do
              if [[ -f "$file" ]]; then
                BASE_FILES+=("$file")
              fi
            done
            if (( ${#BASE_FILES[@]} == 0 )); then
              printf '[]\n' > /tmp/ruff-base.json
            else
              ruff check --output-format=json -- "${BASE_FILES[@]}" > /tmp/ruff-base.json || true
            fi
          )
          git worktree remove --force "$BASE_TREE" >/dev/null

          # Legacy debt is a baseline, not a reason to reject a focused change.
          # Compare diagnostics by file/rule/message and fail only when the new
          # revision contains more instances than the base revision. This also
          # avoids false positives when an unrelated edit merely shifts line
          # numbers of pre-existing diagnostics.
          python - <<'PY'
          import collections
          import json
          import os
          import sys

          def load(path):
              with open(path, encoding="utf-8") as handle:
                  return json.load(handle)

          def key(item):
              filename = os.path.normpath(item["filename"])
              return (filename, item.get("code"), item.get("message"))

          base = load("/tmp/ruff-base.json")
          head = load("/tmp/ruff-head.json")
          base_counts = collections.Counter(key(item) for item in base)
          seen = collections.Counter()
          new = []

          for item in head:
              fingerprint = key(item)
              seen[fingerprint] += 1
              if seen[fingerprint] > base_counts[fingerprint]:
                  new.append(item)

          if not new:
              print("No new Ruff violations introduced by this change.")
              sys.exit(0)

          print("New Ruff violations introduced by this change:")
          for item in new:
              location = item.get("location") or {}
              row = location.get("row", "?")
              column = location.get("column", "?")
              code = item.get("code") or "ruff"
              print(f"{item['filename']}:{row}:{column}: {code} {item.get('message', '')}")

          print(f"\n{len(new)} new Ruff violation(s). Existing baseline debt is ignored.")
          sys.exit(1)
          PY

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Verify shared contracts
        run: python tools/verify_contracts.py
      - name: Test
        run: pytest --cov=laclaugpt_data_analysis --cov-report=term-missing
