name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint new Python violations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lint tooling
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Parse all Python files
        run: python -m compileall -q src/ tests/
      - name: Lint new violations in changed Python files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "${BEFORE_SHA:-}" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$BEFORE_SHA"
          else
            BASE_SHA="HEAD^"
          fi

          mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.py')
          if (( ${#FILES[@]} == 0 )); then
            echo "No changed Python files to lint."
            exit 0
          fi

          echo "Checking changed Python files for newly introduced Ruff violations:"
          printf '  %s\n' "${FILES[@]}"

          mapfile -t NEW_FILES < <(git diff --name-only --diff-filter=A "$BASE_SHA" HEAD -- '*.py')
          if (( ${#NEW_FILES[@]} )); then
            ruff format --check -- "${NEW_FILES[@]}"
          fi

          # Ruff returns 1 for lint findings and 2 for a failed invocation.
          lint_report() {
            ruff check --output-format=json -- "$@" || [[ $? == 1 ]]
          }

          TEMP_DIR="$(mktemp -d)"
          BASE_TREE="$TEMP_DIR/base"
          git worktree add --detach "$BASE_TREE" "$BASE_SHA"
          trap 'git worktree remove --force "$BASE_TREE"; rm -rf "$TEMP_DIR"' EXIT
          lint_report "${FILES[@]}" > "$TEMP_DIR/head.json"
          (
            cd "$BASE_TREE"
            BASE_FILES=()
            for file in "${FILES[@]}"; do
              if [[ -f "$file" ]]; then
                BASE_FILES+=("$file")
              fi
            done
            if (( ${#BASE_FILES[@]} )); then
              lint_report "${BASE_FILES[@]}"
            else
              echo '[]'
            fi
          ) > "$TEMP_DIR/base.json"
          python tools/compare_ruff_reports.py "$TEMP_DIR/base.json" "$BASE_TREE" "$TEMP_DIR/head.json" "$PWD"

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Parse all Python files
        run: python -m compileall -q src/ tests/
      - name: Verify shared contracts
        run: python tools/verify_contracts.py
      - name: Test
        run: pytest --cov=laclaugpt_data_analysis --cov-report=term-missing
