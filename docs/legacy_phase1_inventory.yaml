  - path: laclaugpt/puhti_frame.py
    kind: legacy_script
    decision: delete_after_replacement
    state: quarantined
    deletion_allowed: false
    canonical_replacement:
      - src/laclaugpt_data_analysis/multimodal/
      - src/laclaugpt_data_analysis/prompts/ep24/frame_analysis_v2.md
    regression_tests:
      - tests/test_multimodal.py
      - tests/test_issue_220_optional_multimodal.py
    rationale: "Vision/frame behavior has a canonical evidence-first replacement, but the legacy script remains reference material until downstream EP24 operation is fully proven."
  - path: laclaugpt/puhti_summary.py
    kind: legacy_script
    decision: delete_after_replacement
    state: quarantined
    deletion_allowed: false
    canonical_replacement:
