  - path: src/laclaugpt_data_analysis/plugin_pipeline.py
    symbol: LegacyLaclauPlugin
    kind: compatibility_adapter
    decision: adapt
    state: active_compatibility
    deletion_allowed: false
    canonical_replacement:
      - src/laclaugpt_data_analysis/plugin_pipeline.py
    regression_tests:
      - tests/test_plugin_pipeline.py
    rationale: "The adapter is intentionally inside the canonical plugin runtime. Keep until all legacy-shaped callers use native plugins."
  - path: laclaugpt/README.md
    kind: legacy_assumptions_document
