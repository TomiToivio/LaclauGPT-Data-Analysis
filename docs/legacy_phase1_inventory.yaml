  - path: docs/legacy_ep24_prompts/
    kind: compatibility_reference
    decision: keep
    state: reference_only
    deletion_allowed: false
    canonical_replacement:
      - src/laclaugpt_data_analysis/prompts/ep24/
    regression_tests:
      - tests/test_prompt_library.py
      - tests/test_legacy_discourse_parity.py
    rationale: "These files document the historical scientific prompt contract and are useful for reproducibility; they are not runtime prompt resources."
  - path: docs/EP24_LEGACY_PROMPTS.md
    kind: compatibility_reference
    decision: keep
    state: reference_only
    deletion_allowed: false
    canonical_replacement:
      - src/laclaugpt_data_analysis/prompts/ep24/
    regression_tests:
      - tests/test_prompt_library.py
    rationale: "Keep as the provenance bridge between archived EP24 prompts and the versioned prompt library."
  - path: docs/MULTIMODAL_MIGRATION.md
    kind: migration_document
    decision: keep
    state: active_documentation
    deletion_allowed: false
