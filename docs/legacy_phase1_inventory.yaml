  - path: laclaugpt/puhti_postprocess.py
    kind: legacy_script
    decision: delete_after_replacement
    state: quarantined
    deletion_allowed: false
    canonical_replacement:
      - src/laclaugpt_data_analysis/exporters.py
      - src/laclaugpt_data_analysis/prompts/ep24/postprocess_v1.md
    regression_tests:
      - tests/test_legacy_discourse_parity.py
      - tests/test_phase1_text_runtime.py
    rationale: "Deterministic export and structured postprocessing have canonical homes; compatibility output remains useful for historical EP24 reproducibility."
  - path: laclaugpt/puhti_populism.py
    kind: legacy_script
    decision: delete_after_replacement
    state: quarantined
    deletion_allowed: false
    canonical_replacement:
      - src/laclaugpt_data_analysis/canonical_pipeline.py
      - src/laclaugpt_data_analysis/prompts/ep24/laclau_analysis_v2.md
