# Cron execution layer (public-safe template).
#
# Declares WHEN and HOW work runs. It must not define study semantics (project
# layer) or machine capability (machine layer).
#
# Architecture decision (2026-09-17): the AI26 worker is a BOUNDED process that
# claims a limited number of tasks and exits. Therefore the correct design is
# bounded cron-triggered queue draining — NOT a perpetual worker supervised by
# cron. Cron is the only scheduler; the wrapper never starts a long-lived
# process or an internal scheduler.

execution: cron

schedule:
  # Hourly at :05, deliberately staggered from Collection (:10 collect,
  # :30 media). The worker seeds ready handoffs, drains a bounded batch, and
  # exits. This is the canonical unattended Laskin schedule for AI26 analysis.
  cron: "5 * * * *"
  interval_minutes: 60
  minute: 5
  # Bounded work per tick. Increase through the private runtime environment
  # when backlog requires it; do not convert the worker into a perpetual loop.
  max_tasks_per_tick: 10
  # Reclaim tasks whose lease went idle (crashed worker, interrupted host).
  reclaim_idle_ms: 300000

concurrency:
  # OS-level lock prevents overlapping mutating runs. The wrapper takes flock
  # and exits cleanly when another tick still holds it.
  overlap_lock: flock
  lock_name: ai26-laskin-analysis.lock

behaviour:
  seed_ready: true            # mirror bounded ready handoffs into the task stream
  exit_nonzero_on_failure: true
  work_until_idle: false      # one bounded batch per tick, then exit
  perpetual_scheduler: false  # cron owns scheduling

logging:
  # Operational logs belong under the private runtime root, never the public
  # checkout. The installer defaults to:
  # /mnt/workspace/LaclauGPT-Private/runtime/ai26/analysis/ai26-laskin-analysis.log
  directory: private-runtime
  file: ai26-laskin-analysis.log
  # Debug diagnostics are opt-in; trace mode additionally requires an explicit
  # acknowledgement because prompts/evidence may contain research data.
  debug_env: LACLAUGPT_DEBUG
  trace_env: LACLAUGPT_TRACE

# Failure handling mirrors the worker contract: a handled failure is requeued
# with an incremented attempt and eventually dead-lettered; the durable failure
# history is preserved rather than overwritten.
retry:
  max_attempts: 3
  dead_letter: true


periodic_reports:
  # The wrapper regenerates the latest completed canonical report window after
  # a successful worker cycle. Upserts make hourly execution idempotent while
  # the study profile controls the actual report interval (24h for AI26).
  after_successful_worker: true
  command: laclaugpt-phase1-laskin-report
  source: mongodb
  destination: mongodb
  collection_role: periodic_summaries
