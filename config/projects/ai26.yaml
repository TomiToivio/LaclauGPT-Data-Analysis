# AI26 project layer (public-safe).
#
# Selects analysis stage semantics for the AI26 reference study. This layer
# defines WHAT is analysed; machine/execution layers define WHERE and WHEN.
# Keep study semantics here and operational concerns out of this file.
#
# Source of truth: TomiToivio/LaclauGPT paper/PHASE_1_PAPER.md, docs/AI26_REFERENCE_CASE.md.
# Credentials, private source lists, real corpus data and machine paths never
# belong in this file or in Git at all.
#
# Context composition order (highest evidentiary priority first):
# 1. current source evidence
# 2. current stage instructions
# 3. project/theory context
# 4. source profile context
# 5. codebook context
# 6. situational/periodic context
# 7. researcher/context memory
# 8. RAG context
# Context is never promoted to source evidence merely by appearing in the prompt.

project: ai26
analysis_phase: 1  # Phase 2 modules remain hard-gated until this becomes 2.
dataset:
  title: Ideological contestation over AI
  languages: [en, fi]
  relevance:
    mode: retain_unjudged

context_profile: balanced
contexts:
  project: contexts/projects/ai26_v1.md

codebook:
  public: codebooks/public/ai26_v2.yaml
  private_overlay: null
  merge_order: [public, private_overlay]

analysis:
  # IMPLEMENTED and load-bearing. Enabling an unavailable top-level capability
  # now fails closed in the canonical pipeline instead of silently doing nothing.
  laclau: true
  palonen: true
  sociotechnical_imaginaries: true
  # Produced by the multimodal/light-sociology summary and projected into the
  # canonical analysis section when enabled.
  sentiment: true
  topics: true
  entities: true
  # Context/provenance capabilities used by the canonical staged pipeline.
  context_memory: true
  temporal: true
  multimodal: true

  # Phase 2 / experimental / optional. Even if enabled here, these remain
  # unavailable while top-level analysis_phase is 1.
  sna:
    enabled: false
    phase: 2
    experimental: true
    optional: true
  ant:
    enabled: false
    phase: 2
    experimental: true
    optional: true
  valueflows:
    enabled: false
    phase: 2
    experimental: true
    optional: true

  # Phase 2 / experimental / optional. Off by default during Phase 1.
  dna_statement_coding:
    enabled: false
    phase: 2
    experimental: true
    optional: true
    prompt_version: v1
    concept_mode: codebook_or_provisional
    require_binary_agreement: false
    duplicate_policy: preserve
    include_prior_analysis: true
    include_rag: true
    include_periodic_context: false

  # Phase 2 / experimental / optional. Off by default during Phase 1.
  critical_ai:
    enabled: false
    phase: 2
    experimental: true
    optional: true
    prompt_version: v1
    include_prior_laclau: true
    include_prior_dna: true
    include_rag: true
    include_periodic_context: true
    evidence_mode: strict

arenas:
  - elites
  - grassroots
  - parliamentary

formations:
  - accelerationism
  - doomerism
  - left-wing accelerationism
  - ai safety
  - ai critical
  - anti-ai
dimensions:
  political_economy: [ownership, labour, concentration, redistribution, public infrastructure]
  governance: [regulation, liability, audits, standards, evaluation, democratic control]
  capability_risk: [alignment, catastrophic risk, loss of control, autonomous agents]
  techno_optimism: [abundance, growth, innovation, human flourishing, post-work]
  rights_and_harms: [discrimination, surveillance, copyright, creator rights, data extraction]
  infrastructure: [compute, chips, data centres, energy, water, open weights]
  geopolitics: [AI race, sovereignty, national security, China, export controls]

signifier_hints:
  - safety
  - pacing
  - competition
  - innovation
  - control
  - liability
  - independent evaluation
  - standards
  - open weights
  - labour
  - copyright
  - data centres
  - regulation

prompts:
  frame: ["multimodal.system:v1", "multimodal.frame_analysis:v1"]
  summary: ["multimodal.system:v1", "multimodal.summary_analysis:v1"]
  discourse: ["laclau.system:v1", "laclau.discourse_analysis:v1"]
  dna: ["dna.statement_coding_system:v1", "dna.statement_coding:v1"]
  critical_ai: ["critical_ai.system:v1", "critical_ai.analysis:v1"]
  periodic_summary: ["periodic_summary.narrative:v1"]

storage:
  canonical_records: configured_runtime_backend
  raw_media: configured_runtime_object_store
  redis_required: false

pipeline_version: ai26-phase1-legacy-order-v1
