codebook_id: ai26-public-v2
version: "2026-09-18"
title: AI26 public codebook — ideological contestation over AI
description: >-
  Publication-safe, machine-readable AI26 codebook derived from the public paper.
  Entries are provisional sensitising concepts for retrieval and context memory.
  They are not source evidence and must never be used as actor-level ground-truth ideology.
project: ai26
required_sections: [arenas, safeguards, sampling_dimensions]
optional_sections: [current_watch_relations, entity_seeds, bibliography, rdf_mapping, rag_policy]

entries:
  - kind: formation
    id: accelerationist
    label: accelerationist
    display_label: Accelerationist
    aliases: [accelerationism, techno-optimism, e/acc]
    definition: >-
      Provisional sampling/aggregation anchor for discourses linking accelerated AI or
      technological development to desirable transformation, growth, abundance or progress.
      Techno-optimism and e/acc are not assumed to be synonymous.
    provenance: public-paper
    metadata: {state: PROVISIONAL, human_validation_required: true}

  - kind: formation
    id: existential_risk
    label: existential_risk
    display_label: Existential risk
    aliases: [doomerism, AI doomerism, existential risk, x-risk]
    definition: >-
      Provisional aggregation label for discourse centred on catastrophic or existential AI risk.
      The term doomer is situated and contested; neutral retrieval should prefer x-risk/catastrophic-risk language.
    provenance: public-paper
    metadata: {state: PROVISIONAL, human_validation_required: true}

  - kind: formation
    id: left_accelerationist
    label: left_accelerationist
    display_label: Left accelerationist
    aliases: [left-wing accelerationism, left techno-optimism, post-work techno-optimism]
    definition: >-
      Provisional anchor for technology-positive projects articulating automation with egalitarian,
      redistributive, post-work, public-interest or postcapitalist futures.
    provenance: public-paper
    metadata: {state: PROVISIONAL, human_validation_required: true}

  - kind: formation
    id: ai_safety
    label: ai_safety
    display_label: AI safety
    aliases: [AI safety, AI safety discourse, alignment discourse]
    definition: >-
      Provisional anchor for discourse about alignment, evaluation, standards, incidents, pacing,
      robustness, loss of control and governance of advanced AI. It is broader than existential-risk discourse.
    provenance: public-paper
    metadata: {state: PROVISIONAL, human_validation_required: true}

  - kind: formation
    id: critical_ai
    label: critical_ai
    display_label: Critical AI
    aliases: [ai critical, Critical AI, Critical AI Studies]
    definition: >-
      Provisional anchor for discourse foregrounding power, labour, inequality, discrimination,
      surveillance, extraction, ownership, concentration, accountability and social justice.
    provenance: public-paper
    metadata: {state: PROVISIONAL, human_validation_required: true}

  - kind: formation
    id: anti_ai
    label: anti_ai
    display_label: Anti-AI
    aliases: [anti-ai, AI opposition, anti_ai_protest, pause_ai]
    definition: >-
      Provisional anchor for broader opposition to AI or mobilisations against particular deployments.
      Opposition to one deployment must not be generalized into opposition to AI as such.
    provenance: public-paper
    metadata: {state: PROVISIONAL, human_validation_required: true}

  - kind: signifier
    label: artificial intelligence
    aliases: [AI]
    definition: Candidate contested signifier; theoretical role must be demonstrated from articulation.
    provenance: public-paper
  - kind: signifier
    label: AGI
    aliases: [artificial general intelligence]
    definition: Candidate future-oriented signifier used differently across competing AI imaginaries.
    provenance: public-paper
  - kind: signifier
    label: frontier AI
    definition: Candidate signifier linking capability thresholds to safety, governance and competition.
    provenance: public-paper
  - kind: signifier
    label: superintelligence
    definition: Candidate signifier in singularitarian, safety and catastrophic-risk discourse.
    provenance: public-paper
  - kind: signifier
    label: abundance
    definition: Candidate signifier connecting AI to growth, prosperity, post-scarcity or redistribution.
    provenance: public-paper
  - kind: signifier
    label: innovation
    definition: Candidate signifier often articulated with growth, competition, regulation and national strategy.
    provenance: public-paper
  - kind: signifier
    label: existential risk
    aliases: [x-risk]
    definition: Candidate signifier concerning threats to humanity's continued existence.
    provenance: public-paper
  - kind: signifier
    label: catastrophic risk
    definition: Candidate signifier for severe AI harms that may or may not be framed as existential.
    provenance: public-paper
  - kind: signifier
    label: alignment
    definition: Candidate signifier in debates over model goals, control, safety and authority.
    provenance: public-paper
  - kind: signifier
    label: pacing
    aliases: [slowdown, pause]
    definition: Candidate signifier concerning the speed and sequencing of advanced-AI development and deployment.
    provenance: public-context
  - kind: signifier
    label: independent evaluation
    aliases: [third-party evaluation, external evaluation]
    definition: Candidate governance signifier concerning who evaluates advanced AI and with what authority.
    provenance: public-context
  - kind: signifier
    label: AI race
    aliases: [AI competition]
    definition: Candidate geopolitical/economic signifier linking AI development to strategic competition.
    provenance: public-paper
  - kind: signifier
    label: democratic control
    aliases: [democratic AI]
    definition: Candidate signifier linking AI governance to public authority, participation and accountability.
    provenance: public-paper
  - kind: signifier
    label: public interest AI
    aliases: [public-interest AI]
    definition: Candidate signifier for AI articulated as public infrastructure, public service or social good.
    provenance: public-paper
  - kind: signifier
    label: open weights
    aliases: [open-weight AI]
    definition: Candidate signifier connecting openness to innovation, safety, sovereignty and concentration.
    provenance: public-context
  - kind: signifier
    label: corporate concentration
    aliases: [market concentration, Big Tech concentration]
    definition: Candidate political-economy signifier concerning ownership and institutional power in AI.
    provenance: public-paper
  - kind: signifier
    label: labour
    aliases: [workers, employment]
    definition: Candidate signifier in automation, job displacement, bargaining and post-work discourse.
    provenance: public-paper
  - kind: signifier
    label: copyright
    aliases: [creator rights]
    definition: Candidate signifier in generative-AI disputes over training data, compensation and creative work.
    provenance: public-paper
  - kind: signifier
    label: data centres
    aliases: [AI data centres, datacentres]
    definition: Candidate infrastructure signifier connecting AI to energy, water, local development and opposition.
    provenance: public-paper

  - kind: topic
    label: AI governance
    definition: Regulation, standards, liability, audits, evaluation, public oversight and institutional authority.
    provenance: public-paper
  - kind: topic
    label: AI political economy
    definition: Ownership, labour, concentration, extraction, investment and distribution of AI benefits and harms.
    provenance: public-paper
  - kind: topic
    label: AI labour and automation
    definition: Employment, displacement, workplace control, bargaining, post-work and automation politics.
    provenance: public-paper
  - kind: topic
    label: AI creative work
    definition: Generative AI, creator rights, copyright, cultural labour and training-data disputes.
    provenance: public-paper
  - kind: topic
    label: AI infrastructure and environment
    definition: Compute, chips, data centres, energy, water, emissions and local infrastructure conflicts.
    provenance: public-paper
  - kind: topic
    label: AI geopolitics
    definition: Sovereignty, national security, strategic competition, China, export controls and national AI capacity.
    provenance: public-paper
  - kind: topic
    label: AI safety and catastrophic risk
    definition: Alignment, evaluation, loss of control, catastrophic risk, x-risk and pacing.
    provenance: public-paper

sections:
  arenas:
    elites: AI labs, researchers, entrepreneurs, intellectuals and adjacent movements
    grassroots: mobilisation around labour, culture, surveillance, environment, data centres, safety and deployment resistance
    parliamentary: parliamentary, electoral, government, party and policy discourse

  sampling_dimensions:
    - political_economy
    - governance
    - capability_risk
    - techno_optimism
    - rights_and_harms
    - infrastructure
    - geopolitics

  current_watch_relations:
    - [AI safety, pacing]
    - [AI safety, independent evaluation]
    - [innovation, competition]
    - [AI race, China]
    - [open weights, safety]
    - [open weights, innovation]
    - [automation, labour]
    - [generative AI, copyright]
    - [data centres, energy]
    - [AI, corporate concentration]


  entity_seeds:
    - label: Nick Srnicek
      wikipedia_title: Nick Srnicek
      entity_type: person
      formation_hints: [left_accelerationist]
      rdf_types: [schema:Person, prov:Agent]
      description: Researcher seed for post-work, automation and postcapitalist context; not actor-level formation evidence.
    - label: Alex Williams
      wikipedia_title: Alex Williams (political theorist)
      entity_type: person
      formation_hints: [left_accelerationist]
      rdf_types: [schema:Person, prov:Agent]
      description: Researcher seed for left-accelerationist context; not actor-level formation evidence.
    - label: Aaron Bastani
      wikipedia_title: Aaron Bastani
      entity_type: person
      formation_hints: [left_accelerationist]
      rdf_types: [schema:Person, prov:Agent]
      description: Researcher seed for automation/abundance context; not actor-level formation evidence.
    - label: Eliezer Yudkowsky
      wikipedia_title: Eliezer Yudkowsky
      entity_type: person
      formation_hints: [existential_risk, ai_safety]
      rdf_types: [schema:Person, prov:Agent]
      description: Retrieval seed for existential-risk and AI-safety discourse; hints are not permanent actor labels.
    - label: Timnit Gebru
      wikipedia_title: Timnit Gebru
      entity_type: person
      formation_hints: [critical_ai]
      rdf_types: [schema:Person, prov:Agent]
      description: Retrieval seed for Critical AI context; not actor-level formation evidence.
    - label: PauseAI
      wikipedia_title: PauseAI
      entity_type: organization
      formation_hints: [anti_ai, ai_safety]
      rdf_types: [schema:Organization, prov:Agent]
      description: Movement seed for pause/slowdown discourse. Failure to resolve Wikipedia must not trigger guessed Wikidata IDs.

  bibliography:
    - id: Jasanoff_2015
      kind: research_reference
      citation: "Jasanoff, S. (2015). Future Imperfect: Science, Technology, and the Imaginations of Modernity."
      rag_role: sociotechnical_imaginaries
    - id: Srnicek_Williams_2015
      kind: research_reference
      citation: "Srnicek, N. & Williams, A. (2015). Inventing the Future."
      rag_role: left_accelerationist
    - id: Bastani_2019
      kind: research_reference
      citation: "Bastani, A. (2019). Fully Automated Luxury Communism."
      rag_role: left_accelerationist
    - id: Gebru_Torres_2024
      kind: research_reference
      citation: "Gebru, T. & Torres, É. P. (2024). TESCREAL critique and ideological genealogy."
      rag_role: critical_ai
    - id: Richter_Katzenbach_Schaefer_2023
      kind: research_reference
      citation: "Richter, V., Katzenbach, C. & Schäfer, M. S. (2023). Research on imaginaries of AI."
      rag_role: sociotechnical_imaginaries
    - id: Oldenburg_Papyshev_2025
      kind: research_reference
      citation: "Oldenburg & Papyshev (2025). The Stories We Govern By: AI, Risk, and the Power of Imaginaries."
      rag_role: ai_imaginaries
    - id: De_Lima_Zou_2026
      kind: research_reference
      citation: "De, Lima & Zou (2026). What is Safety? Corporate Discourse, Power, and the Politics of Generative AI Safety."
      rag_role: ai_safety

  rdf_mapping:
    identity:
      local_identity: project_local_stable_id
      external_identity: wikidata_qid_when_available
      display_identity: english_wikipedia_title
      rule: Wikipedia URLs are never primary keys.
    classes:
      person: schema:Person
      organization: schema:Organization
      corporation: schema:Corporation
      government: schema:GovernmentOrganization
      media: schema:NewsMediaOrganization
      formation: [skos:Concept, laclaugpt:Formation]
      signifier: [skos:Concept, laclaugpt:Signifier]
    provenance_classes:
      - background_knowledge
      - researcher_seed
      - corpus_evidence
      - llm_inference
    seed_relation: laclaugpt:seedFormation
    analytical_relation: laclaugpt:formationEvidence

  rag_policy:
    retrieval: query_driven
    whole_codebook_injection: false
    log_supplied_chunks: true
    safeguards:
      - source text has epistemic priority for document-level claims
      - researcher seed hints are context, not evidence
      - background knowledge is distinct from corpus evidence and llm inference
      - only relevant concepts should be retrieved for each analysis step

  safeguards:
    - frequency is not hegemony
    - polysemy is not evidence of floating or empty signification
    - disagreement or negative sentiment is not automatically antagonism
    - sentiment is not affective investment
    - one future claim is not a stabilized sociotechnical imaginary
    - source family or actor identity is not formation membership
    - one document is not a validated ideological formation
    - formation labels are provisional and multi-label overlap or abstention is valid
