codebook_id: ep24-fi-pl-v2
version: "2.0.0"
title: EP24 Finland and Poland public methodology layer
description: >-
  Public, privacy-safe methodology and language grounding for reprocessing the 2024
  European Parliament election corpus from Finland and Poland. Researcher workbooks,
  row-level annotations and private entity/theme mappings are deliberately excluded and
  must be layered at runtime from the controlled private codebook.
project: ep24
arena: european-parliament-election-2024
required_sections:
  - epistemic_rules
  - multimodal_rules
  - translation_rules
  - laclau_rules
optional_sections:
  - public_context
