[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "laclaugpt-data-analysis"
version = "0.1.0"
description = "Storage-neutral analysis core for the modular LaclauGPT research framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "CC0-1.0"}
authors = [{name = "Tomi Toivio"}]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0",
]

[project.scripts]
laclaugpt-analysis-worker = "laclaugpt_data_analysis.distributed_worker:main"

[project.optional-dependencies]
analysis = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "networkx>=3.3",
]
nlp = [
  "spacy>=3.7",
  "sentence-transformers>=3.0",
  "transformers>=4.44",
]
topics = [
  "bertopic>=0.16",
  "gensim>=4.3",
]
ollama = [
  "ollama>=0.6,<1",
]
remote = [
  "pymongo>=4.8",
  "redis>=5.0",
  "boto3>=1.35",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "numpy>=1.26",
  "networkx>=3.3",
]
all = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "networkx>=3.3",
  "spacy>=3.7",
  "sentence-transformers>=3.0",
  "transformers>=4.44",
  "bertopic>=0.16",
  "gensim>=4.3",
  "ollama>=0.6,<1",
  "pymongo>=4.8",
  "redis>=5.0",
  "boto3>=1.35",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/laclaugpt_data_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
source = ["laclaugpt_data_analysis"]
branch = true
