[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "laclaugpt-data-analysis"
version = "0.1.0"
description = "Storage-neutral analysis core for the modular LaclauGPT research framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "CC0-1.0"}
authors = [{name = "Tomi Toivio"}]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0",
  "feedparser>=6.0",
  "requests>=2.32.4,<3",
]

[project.scripts]
laclaugpt-analysis-worker = "laclaugpt_data_analysis.contextual_entrypoints:worker_main"
laclaugpt-phase1-shadow = "laclaugpt_data_analysis.phase1_shadow:main"
laclaugpt-phase1-laskin = "laclaugpt_data_analysis.phase1_laskin:main"
laclaugpt-reprocess = "laclaugpt_data_analysis.contextual_entrypoints:reprocessing_main"
laclaugpt-ep24 = "laclaugpt_data_analysis.ep24_reprocessing:main"
laclaugpt-summarize-period = "laclaugpt_data_analysis.periodic_summary:main"
laclaugpt-preflight = "laclaugpt_data_analysis.preflight:main"
laclaugpt-freeze-ai26 = "laclaugpt_data_analysis.freeze_run:main"
laclaugpt-hungary26-roihu = "laclaugpt_data_analysis.hungary26_roihu:main"

[project.optional-dependencies]
analysis = [
  "pandas>=2.2",
  "polars>=1.8",
  "numpy>=1.26",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "networkx>=3.3",
  "igraph>=0.11",
  "leidenalg>=0.10",
]
arrow = [
  "pyarrow>=17",
]
nlp = [
  "spacy>=3.7",
  "sentence-transformers>=3.0",
  "transformers>=4.44",
]
topics = [
  "bertopic>=0.16",
  "gensim>=4.3",
]
phase1-nlp = [
  "textacy>=0.13,<1",
  "yake>=0.4,<1",
  "keybert>=0.9,<1",
  "hdbscan>=0.8.40,<1",
  "umap-learn>=0.5.7,<1",
  "scikit-network>=0.33,<1",
  "ruptures>=1.1.9,<2",
]
ollama = [
  "ollama>=0.6,<1",
]
rag = [
  "neo4j>=5.25,<7",
]
rdf = [
  "rdflib>=7.1,<8",
  "pyshacl>=0.30,<1",
]
remote = [
  "pymongo>=4.8",
  "redis>=5.0",
  "boto3>=1.35",
  "pymongo>=4.8",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "numpy>=1.26",
  "scipy>=1.14",
  "networkx>=3.3",
  "rdflib>=7.1,<8",
  "pyshacl>=0.30,<1",
  "boto3>=1.35",
  "pymongo>=4.8",
  "ollama>=0.6,<1",
]
all = [
  "pandas>=2.2",
  "polars>=1.8",
  "numpy>=1.26",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "networkx>=3.3",
  "igraph>=0.11",
  "leidenalg>=0.10",
  "pyarrow>=17",
  "spacy>=3.7",
  "sentence-transformers>=3.0",
  "transformers>=4.44",
  "bertopic>=0.16",
  "gensim>=4.3",
  "ollama>=0.6,<1",
  "neo4j>=5.25,<7",
  "rdflib>=7.1,<8",
  "pyshacl>=0.30,<1",
  "pymongo>=4.8",
  "redis>=5.0",
  "boto3>=1.35",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/laclaugpt_data_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src", ".", "laclaugpt"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Keep currently valid Python 3.11 spellings stable across Ruff releases.
# These can be removed once the minimum Python version and legacy DNA code are modernized together.
ignore = ["E501", "UP017", "UP035", "UP037"]

[tool.ruff.lint.per-file-ignores]
"src/laclaugpt_data_analysis/rag.py" = ["I001"]

[tool.coverage.run]
source = ["laclaugpt_data_analysis"]
branch = true
